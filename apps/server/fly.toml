# fly.toml — WatchBag server
# One-time setup:
#   cd <repo root>
#   flyctl launch --config apps/server/fly.toml --dockerfile Dockerfile.server --no-deploy
#   flyctl secrets set --config apps/server/fly.toml \
#     DATABASE_URL=...  BETTER_AUTH_SECRET=...  BETTER_AUTH_URL=https://watchbag-api.fly.dev \
#     GOOGLE_CLIENT_ID=...  GOOGLE_CLIENT_SECRET=...  TMDB_API_KEY=... \
#     CLOUDINARY_CLOUD_NAME=...  CLOUDINARY_API_KEY=...  CLOUDINARY_API_SECRET=... \
#     CORS_ORIGIN=https://watchbag.vercel.app
# Then deploy: flyctl deploy --config apps/server/fly.toml

app = "watchbag-api"
primary_region = "bom"  # Mumbai; pick the region closest to your Neon instance

[build]
  dockerfile = "../../Dockerfile.server"

# Runs before the new release cuts over. If this fails, the old version stays
# live — so a broken migration doesn't break the running app.
[deploy]
  release_command = "node dist/db/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
